[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SrWalkerB/rust-disc-image"

[workspace.dependencies]
disc-image = { path = "crates/disc-image", version = "0.1.0" }
iso9660 = { path = "crates/iso9660", version = "0.1.0" }
iso-test-builder = { path = "crates/iso-test-builder" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
